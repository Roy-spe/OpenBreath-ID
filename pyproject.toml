[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbreath-id"
version = "0.1.0"
description = "Partial neural research companion for within-recording nasal verification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "torch>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
